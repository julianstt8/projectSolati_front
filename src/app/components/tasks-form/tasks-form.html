<div class="form-container">
  <h3>{{ task ? 'Editar Tarea' : 'Nueva Tarea' }}</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Título:
      <input formControlName="title" placeholder="Título de la tarea">
    </label>

    <label>
      Descripción:
      <textarea formControlName="description" placeholder="Descripción"></textarea>
    </label>

    <label>
      Estado:
      <select formControlName="status">
        <option value="0">Pendiente</option>
        <option value="1">Completada</option>
      </select>
    </label>

    <button type="submit">{{ task ? 'Actualizar' : 'Crear' }}</button>
    <button type="button" (click)="cancel()">Cancelar</button>
  </form>
</div>
